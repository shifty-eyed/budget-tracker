<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Budget Tracker</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdn.plaid.com/link/v2/stable/link-initialize.js" defer></script>
    <script src="config.js" defer></script>
    <script src="index.js" defer></script>
  </head>
  <body>
    <header class="app-header">
      <h1>Budget Tracker</h1>
      <p class="subtitle">Connect your accounts and view recent Plaid transactions.</p>
    </header>

    <main class="app-main">
      <section class="actions">
        <button id="link-button" class="primary-button">Connect a bank account</button>
        <button id="refresh-button" class="secondary-button" disabled>Refresh transactions</button>
        <p id="status-message" class="status-message" role="status"></p>
      </section>

      <section class="transactions">
        <h2>Recent transactions</h2>
        <div class="table-wrapper">
          <table id="transactions-table">
            <thead>
              <tr>
                <th scope="col">Date</th>
                <th scope="col">Name</th>
                <th scope="col">Category</th>
                <th scope="col" class="amount-column">Amount</th>
              </tr>
            </thead>
            <tbody id="transactions-body">
              <tr class="placeholder-row">
                <td colspan="4">No transactions yet. Connect an account to get started.</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>

    <footer class="app-footer">
      <p>
        This demo stores access tokens in memory and is intended for local development only.
      </p>
    </footer>
  </body>
</html>
